apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccro-solver
  namespace: ccro-production
  labels:
    app: ccro-solver
    component: deterministic-solver
    part-of: ccro-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ccro-solver
  template:
    metadata:
      labels:
        app: ccro-solver
    spec:
      containers:
        - name: solver
          image: ccro-registry.azurecr.io/ccro-solver:latest
          ports:
            - containerPort: 8001
          env:
            - name: CCRO_SOLVER_PORT
              value: "8001"
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ccro-solver
  namespace: ccro-production
spec:
  selector:
    app: ccro-solver
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ccro-solver-hpa
  namespace: ccro-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ccro-solver
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
