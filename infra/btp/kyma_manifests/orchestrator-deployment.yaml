apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccro-orchestrator
  namespace: ccro-production
  labels:
    app: ccro-orchestrator
    component: ai-orchestration
    part-of: ccro-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ccro-orchestrator
  template:
    metadata:
      labels:
        app: ccro-orchestrator
    spec:
      containers:
        - name: orchestrator
          image: ccro-registry.azurecr.io/ccro-orchestrator:latest
          ports:
            - containerPort: 8000
          env:
            - name: CCRO_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ccro-secrets
                  key: redis-url
            - name: CCRO_ORCHESTRATOR_PORT
              value: "8000"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ccro-orchestrator
  namespace: ccro-production
spec:
  selector:
    app: ccro-orchestrator
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ccro-orchestrator-hpa
  namespace: ccro-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ccro-orchestrator
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
