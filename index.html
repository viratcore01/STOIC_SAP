    @keyframes slide-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

                <span className="text-xxs text-cs-dim ml-1.5">v0.1</span>

            </div>
          </div>

    // ─── State Machine Bar ─────────────────────────────────
    function StateMachine({ current }) {
      const idx = STATES.indexOf(current);
      return (
        <div className="flex items-stretch gap-1 h-10 rounded-lg overflow-hidden border border-cs-border">
          {STATES.map((s, i) => {
            const c = STATE_CONFIG[s];
            const active = i === idx;
            const past = i < idx;
            return (
              <div
                key={s}
                className="flex-1 flex items-center justify-center gap-1.5 relative transition-all duration-300"
                style={{
                  background: active ? c.bg : past ? c.bg.replace(/[\d.]+\)$/, '0.04)') : 'transparent',
                  borderBottom: active ? `2px solid ${c.color}` : '2px solid transparent',
                }}
              >
                {active && <div className="w-1.5 h-1.5 rounded-full pulse-dot" style={{ background: c.color }} />}
                <span className={`text-xxs font-semibold tracking-wider ${active ? '' : past ? 'opacity-50' : 'opacity-30'}`} style={{ color: active ? c.color : '#8B9CB3' }}>
                  {s}
                </span>
                {i === idx && (
                  <span className="text-xxs text-cs-muted ml-1 hidden lg:inline">{c.full}</span>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    // ─── Vitals Panel ──────────────────────────────────────
    function Vital({ label, value, unit, color, sub }) {

          </div>
          {sub && <div className="text-xxs text-cs-dim mt-1">{sub}</div>}
        </div>
      );
    }

    function CapacityGauge({ margin }) {
      const pct = Math.max(0, Math.min(100, margin * 100));
      const color = margin > 0.15 ? '#3D8B7A' : margin > 0 ? '#D4A017' : '#C23B3B';
      const thresholdPct = 15;
      return (
        <div className="px-4 py-3 bg-cs-s2 rounded-lg border border-cs-border">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xxs font-medium text-cs-dim uppercase tracking-wider">Capacity Margin</span>
            <span className="text-sm font-semibold tabular-nums" style={{ color }}>{(margin * 100).toFixed(1)}%</span>
          </div>
          <div className="h-1.5 bg-cs-s3 rounded-full relative overflow-visible">
            <div className="absolute top-0 left-0 h-full rounded-full transition-all duration-500" style={{ width: `${pct}%`, background: color }} />

          <div className="flex justify-between mt-1.5">
            <span className="text-xxs text-cs-dim">0%</span>
            <span className="text-xxs text-cs-dim">15%</span>
            <span className="text-xxs text-cs-dim">100%</span>

            </div>
          </div>

          {/* Key Metrics */}

            </div>
            <div className="bg-cs-s1 rounded-xl border border-cs-border p-4">
              <div className="text-xxs text-cs-dim uppercase tracking-wider mb-2">Recovery Options</div>
              <div className="text-3xl font-semibold text-cs-accent tabular-nums">4</div>
              <div className="text-xxs text-cs-dim mt-1">route, warehouse, fleet</div>
            </div>
            <div className="bg-cs-s1 rounded-xl border border-cs-border p-4">
              <div className="text-xxs text-cs-dim uppercase tracking-wider mb-2">Pending Allocations</div>

                    state === s
                      ? 'border-cs-accent/40 bg-cs-accent/10 text-cs-accent'
                      : 'border-cs-border bg-cs-s2 text-cs-muted hover:bg-cs-s3 hover:text-cs-text'

                  onClick={() => window.__setSimState(s)}
                >
                  {s} {STATE_CONFIG[s].full.split(' ')[0]}
                </button>
              ))}
            </div>
          </div>
        </div>
      );

        <div className="slide-in space-y-5">
          {/* Header */}
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-lg font-semibold text-cs-text">Allocation Approval</h1>
              <p className="text-xs text-cs-dim mt-0.5">Human-in-the-loop decision for scarce cold-chain inventory</p>
            </div>
            <Badge color="#D4A017">Awaiting Decision</Badge>
          </div>

          {/* Side-by-Side Comparison */}
          <div className="grid grid-cols-2 gap-4">
            {/* Do Nothing */}
            <div className="bg-cs-s1 rounded-xl border border-cs-border p-5">
              <div className="flex items-center gap-2 mb-3">
                <div className="w-5 h-5 rounded-md bg-cs-s3 flex items-center justify-center">
                  <Icon d={Icons.x} size={12} stroke="#5C6B7F" />
                </div>
                <span className="text-sm font-medium text-cs-dim">Do Nothing / Standard Route</span>
              </div>
              <p className="text-xs text-cs-dim leading-relaxed mb-4">
                Standard cost-minimization TMS routing. No policy-weighted allocation applied.
              </p>
              <div className="space-y-2.5">
                <div className="flex justify-between text-xs">
                  <span className="text-cs-dim">Sites at risk</span>
                  <span className="text-cs-crit font-medium">2 dropped</span>
                </div>
                <div className="flex justify-between text-xs">
                  <span className="text-cs-dim">Inventory preserved</span>
                  <span className="text-cs-text font-medium">350 units</span>
                </div>
                <div className="flex justify-between text-xs">
                  <span className="text-cs-dim">Spoilage cost</span>
                  <span className="text-cs-crit font-medium">€ 84,200</span>
                </div>
              </div>
            </div>

            {/* CCRO Allocation */}
            <div className="rounded-xl p-5" style={{ background: 'rgba(91,159,207,0.04)', border: '1px solid rgba(91,159,207,0.15)' }}>
              <div className="flex items-center gap-2 mb-3">
                <div className="w-5 h-5 rounded-md bg-cs-accent/15 flex items-center justify-center">
                  <Icon d={Icons.check} size={12} stroke="#5B9FCF" />
                </div>
                <span className="text-sm font-medium text-cs-accent">CCRO Policy Allocation</span>
              </div>
              <p className="text-xs text-cs-muted leading-relaxed mb-4">
                Priority-weighted allocation with policy justification. Optimised for clinical urgency.
              </p>
              <div className="space-y-2.5">
                <div className="flex justify-between text-xs">
                  <span className="text-cs-muted">Sites covered</span>
                  <span className="text-cs-accent font-medium">5 of 7</span>
                </div>
                <div className="flex justify-between text-xs">
                  <span className="text-cs-muted">Units allocated</span>
                  <span className="text-cs-text font-medium">400 units</span>
                </div>
                <div className="flex justify-between text-xs">
                  <span className="text-cs-muted">Spoilage avoided</span>
                  <span className="text-cs-stable font-medium">€ 127,500</span>
                </div>
                <div className="flex justify-between text-xs">
                  <span className="text-cs-muted">Objective value</span>
                  <span className="text-cs-text font-medium tabular-nums">{totalFulfillment.toFixed(3)}</span>
                </div>
              </div>
            </div>
          </div>

          {/* Allocation Table */}
          <div className="bg-cs-s1 rounded-xl border border-cs-border overflow-hidden">
            <div className="px-5 py-3 border-b border-cs-border flex items-center justify-between">
              <span className="text-xs font-medium text-cs-muted">Proposed Allocation</span>
              <span className="text-xxs text-cs-dim">{SITES.length} sites &middot; {SITES.reduce((s,a)=>s+a.units,0)} units</span>
            </div>
            <table className="w-full text-xs">
              <thead>
                <tr className="border-b border-cs-border">
                  <th className="text-left px-5 py-2.5 text-xxs font-medium text-cs-dim uppercase tracking-wider">Site</th>
                  <th className="text-right px-5 py-2.5 text-xxs font-medium text-cs-dim uppercase tracking-wider">Units</th>
                  <th className="text-left px-5 py-2.5 text-xxs font-medium text-cs-dim uppercase tracking-wider">Vehicle</th>
                  <th className="text-right px-5 py-2.5 text-xxs font-medium text-cs-dim uppercase tracking-wider">P<sub>i</sub></th>
                  <th className="text-right px-5 py-2.5 text-xxs font-medium text-cs-dim uppercase tracking-wider">Mass (kg)</th>
                </tr>
              </thead>
              <tbody>
                {SITES.map((s, i) => (
                  <tr key={s.id} className={`border-b border-cs-border/50 ${i === SITES.length - 1 ? 'border-b-0' : ''}`}>
                    <td className="px-5 py-2.5">
                      <span className="font-medium text-cs-text">{s.id}</span>
                      <span className="text-cs-dim ml-1.5">{s.city}</span>
                    </td>
                    <td className="text-right px-5 py-2.5 tabular-nums text-cs-text font-medium">{s.units}</td>
                    <td className="px-5 py-2.5 text-cs-muted font-mono text-xxs">{s.vehicle}</td>
                    <td className="text-right px-5 py-2.5 tabular-nums font-medium" style={{ color: s.pi > 0.7 ? '#3D8B7A' : s.pi > 0.5 ? '#5B9FCF' : '#8B9CB3' }}>{s.pi.toFixed(3)}</td>
                    <td className="text-right px-5 py-2.5 tabular-nums text-cs-muted">{s.mass}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Dropped Sites */}
          {DROPPED.length > 0 && (
            <div className="rounded-xl border p-4" style={{ background: 'rgba(194,59,59,0.04)', borderColor: 'rgba(194,59,59,0.15)' }}>
              <div className="flex items-center gap-2 mb-3">
                <Icon d={Icons.warn} size={14} stroke="#C23B3B" />
                <span className="text-xs font-medium text-cs-crit">Dropped Sites ({DROPPED.length})</span>
              </div>
              <div className="space-y-2">
                {DROPPED.map(d => (
                  <div key={d.id} className="flex items-start gap-3 text-xs pl-5">
                    <span className="font-medium text-cs-crit/80">{d.id}</span>
                    <span className="text-cs-dim">{d.reason}</span>
                    <span className="text-cs-dim/60">{d.detail}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Policy Citations */}
          <div className="bg-cs-s1 rounded-xl border border-cs-border p-4">
            <div className="flex items-center justify-between mb-3">
              <span className="text-xs font-medium text-cs-muted">Policy Justification</span>
              <span className="text-xxs text-cs-dim">Confidence: 87.3%</span>
            </div>
            <div className="flex gap-2 mb-4">
              <div className="px-3 py-1.5 rounded-lg bg-cs-s2 border border-cs-border">
                <span className="text-xxs text-cs-dim">w1</span>
                <span className="text-xs font-medium text-cs-text ml-1.5 tabular-nums">0.520</span>
                <span className="text-xxs text-cs-dim ml-1">Clinical</span>
              </div>
              <div className="px-3 py-1.5 rounded-lg bg-cs-s2 border border-cs-border">
                <span className="text-xxs text-cs-dim">w2</span>
                <span className="text-xs font-medium text-cs-text ml-1.5 tabular-nums">0.180</span>
                <span className="text-xxs text-cs-dim ml-1">Operations</span>
              </div>
              <div className="px-3 py-1.5 rounded-lg bg-cs-s2 border border-cs-border">
                <span className="text-xxs text-cs-dim">w3</span>
                <span className="text-xs font-medium text-cs-text ml-1.5 tabular-nums">0.300</span>
                <span className="text-xxs text-cs-dim ml-1">Value</span>
              </div>
            </div>
            <div className="space-y-2">
              {CLAUSES.map(c => (
                <div key={c.id} className="flex items-start gap-2.5 px-3 py-2 rounded-lg bg-cs-s2 border border-cs-border/50">
                  <span className="inline-flex items-center px-2 py-0.5 rounded text-xxs font-medium bg-cs-policy/10 text-cs-policy border border-cs-policy/20 flex-shrink-0 mt-0.5">
                    {c.id}
                  </span>
                  <span className="text-xs text-cs-muted leading-relaxed">{c.text}</span>
                  <span className="text-xxs text-cs-dim flex-shrink-0 mt-0.5">{(c.score * 100).toFixed(0)}%</span>
                </div>
              ))}
            </div>
          </div>

          {/* Actions */}
          <div className="flex items-center gap-3">
            <button
              className="px-5 py-2.5 rounded-lg text-sm font-medium bg-cs-s3 border border-cs-border text-cs-text hover:bg-cs-s3/80 transition-colors duration-150 cursor-pointer"
              onClick={() => window.__showToast('Modification editor opened', 'info')}
            >
              Modify Allocation
            </button>
            <button
              className="px-5 py-2.5 rounded-lg text-sm font-medium text-cs-crit/80 border border-cs-crit/20 hover:bg-cs-crit/10 transition-colors duration-150 cursor-pointer"
              onClick={() => window.__showToast('Allocation rejected. Requesting alternate plan.', 'danger')}
            >
              Reject
            </button>
            <div className="flex-1" />
            <button
              className="px-6 py-2.5 rounded-lg text-sm font-semibold text-cs-bg transition-colors duration-150 cursor-pointer"
              style={{ background: '#5B9FCF', border: '1px solid #5B9FCF' }}
              onClick={() => window.__showToast('Allocation approved. Execution Agent triggered.', 'success')}
            >
              Approve Allocation
            </button>
          </div>
        </div>
      );
    }

    // ─── Allocations Page ──────────────────────────────────
    function AllocationsPage() {
      const statusColor = { Pending: '#D4A017', Executed: '#3D8B7A', Rejected: '#C23B3B' };
      return (
        <div className="slide-in space-y-5">
          <div>
            <h1 className="text-lg font-semibold text-cs-text">Allocation History</h1>
            <p className="text-xs text-cs-dim mt-0.5">All allocation plans with status and execution details</p>
          </div>
          <div className="bg-cs-s1 rounded-xl border border-cs-border overflow-hidden">
            <table className="w-full text-xs">
              <thead>
                <tr className="border-b border-cs-border">
                  <th className="text-left px-5 py-3 text-xxs font-medium text-cs-dim uppercase tracking-wider">Plan ID</th>
                  <th className="text-left px-5 py-3 text-xxs font-medium text-cs-dim uppercase tracking-wider">Status</th>
                  <th className="text-right px-5 py-3 text-xxs font-medium text-cs-dim uppercase tracking-wider">Sites</th>
                  <th className="text-right px-5 py-3 text-xxs font-medium text-cs-dim uppercase tracking-wider">Units</th>
                  <th className="text-right px-5 py-3 text-xxs font-medium text-cs-dim uppercase tracking-wider">Objective</th>
                  <th className="text-left px-5 py-3 text-xxs font-medium text-cs-dim uppercase tracking-wider">Created</th>
                </tr>
              </thead>
              <tbody>
                {ALLOCATIONS.map((a, i) => (
                  <tr key={a.id} className={`border-b border-cs-border/50 hover:bg-cs-s2/50 transition-colors ${i === ALLOCATIONS.length - 1 ? 'border-b-0' : ''}`}>
                    <td className="px-5 py-3 font-mono text-cs-text">{a.id}</td>
                    <td className="px-5 py-3"><Badge color={statusColor[a.status]}>{a.status}</Badge></td>
                    <td className="text-right px-5 py-3 tabular-nums text-cs-text">{a.sites}</td>
                    <td className="text-right px-5 py-3 tabular-nums text-cs-text">{a.units}</td>
                    <td className="text-right px-5 py-3 tabular-nums text-cs-text">{a.obj.toFixed(3)}</td>
                    <td className="px-5 py-3 text-cs-muted">{a.created}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─── Audit Log Page ────────────────────────────────────
    function AuditPage() {
      return (
        <div className="slide-in space-y-5">
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-lg font-semibold text-cs-text">Audit Log</h1>
              <p className="text-xs text-cs-dim mt-0.5">Immutable, hash-chained records for 21 CFR Part 11 compliance</p>
            </div>
            <Badge color="#3D8B7A">Chain Integrity: Verified</Badge>
          </div>
          <div className="bg-cs-s1 rounded-xl border border-cs-border overflow-hidden">
            <table className="w-full text-xs">
              <thead>
                <tr className="border-b border-cs-border">
                  <th className="text-left px-5 py-3 text-xxs font-medium text-cs-dim uppercase tracking-wider">Timestamp</th>
                  <th className="text-left px-5 py-3 text-xxs font-medium text-cs-dim uppercase tracking-wider">Event</th>
                  <th className="text-left px-5 py-3 text-xxs font-medium text-cs-dim uppercase tracking-wider">Actor</th>
                  <th className="text-left px-5 py-3 text-xxs font-medium text-cs-dim uppercase tracking-wider">Thread</th>
                  <th className="text-left px-5 py-3 text-xxs font-medium text-cs-dim uppercase tracking-wider">Plan</th>
                  <th className="text-left px-5 py-3 text-xxs font-medium text-cs-dim uppercase tracking-wider">Hash (prev)</th>
                </tr>
              </thead>
              <tbody>
                {AUDIT_LOG.map((r, i) => (
                  <tr key={i} className={`border-b border-cs-border/50 hover:bg-cs-s2/50 transition-colors ${i === AUDIT_LOG.length - 1 ? 'border-b-0' : ''}`}>
                    <td className="px-5 py-2.5 font-mono text-xxs text-cs-muted">{r.ts}</td>
                    <td className="px-5 py-2.5"><Badge color={EVENT_COLORS[r.event]}>{r.event}</Badge></td>
                    <td className="px-5 py-2.5 text-cs-muted">{r.actor}</td>
                    <td className="px-5 py-2.5 font-mono text-xxs text-cs-dim">{r.thread}</td>
                    <td className="px-5 py-2.5 font-mono text-xxs text-cs-dim">{r.plan}</td>
                    <td className="px-5 py-2.5 font-mono text-xxs text-cs-dim">{r.hash}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─── Settings Page ─────────────────────────────────────
    function SettingsPage() {
      const settings = [
        { label: 'S2 → S3 Threshold', value: '15%', desc: 'Capacity margin below this triggers S3' },
        { label: 'Handling Buffer', value: '2.0h', desc: 'Added to transit time for C1 check' },
        { label: 'Solver Time Limit', value: '30s', desc: 'Max CP-SAT solve time per invocation' },
        { label: 'Policy Prefetch TTL', value: '5min', desc: 'Cache lifetime for S3-prefetched weights' },
      ];
      const services = [
        { name: 'Orchestrator', status: 'Healthy' },
        { name: 'Solver', status: 'Healthy' },
        { name: 'Policy Agent', status: 'Healthy' },
        { name: 'Sensing', status: 'Healthy' },
        { name: 'Impact', status: 'Healthy' },
        { name: 'Execution', status: 'Healthy' },
      ];
      return (
        <div className="slide-in space-y-5">
          <div>
            <h1 className="text-lg font-semibold text-cs-text">System Settings</h1>
            <p className="text-xs text-cs-dim mt-0.5">CCRO platform configuration and thresholds</p>
          </div>

          <div className="bg-cs-s1 rounded-xl border border-cs-border p-5">
            <span className="text-xs font-medium text-cs-muted">State Machine Thresholds</span>
            <div className="grid grid-cols-2 gap-3 mt-3">
              {settings.map(s => (
                <div key={s.label} className="px-4 py-3 bg-cs-s2 rounded-lg border border-cs-border">
                  <div className="text-xxs text-cs-dim uppercase tracking-wider mb-1">{s.label}</div>
                  <div className="text-xl font-semibold text-cs-text tabular-nums">{s.value}</div>
                  <div className="text-xxs text-cs-dim mt-1">{s.desc}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-cs-s1 rounded-xl border border-cs-border p-5">
            <span className="text-xs font-medium text-cs-muted">SAP Integration</span>
            <div className="grid grid-cols-2 gap-3 mt-3">
              <div className="px-4 py-3 bg-cs-s2 rounded-lg border border-cs-border">
                <div className="text-xxs text-cs-dim uppercase tracking-wider mb-1">S/4HANA Destination</div>
                <div className="text-xs text-cs-muted font-mono">S4HANA_CCRO_DEST</div>
              </div>
              <div className="px-4 py-3 bg-cs-s2 rounded-lg border border-cs-border">
                <div className="text-xxs text-cs-dim uppercase tracking-wider mb-1">TM Destination</div>
                <div className="text-xs text-cs-muted font-mono">TM_CCRO_DEST</div>
              </div>
            </div>
          </div>

          <div className="bg-cs-s1 rounded-xl border border-cs-border p-5">
            <span className="text-xs font-medium text-cs-muted">Agent Services</span>
            <div className="grid grid-cols-3 gap-3 mt-3">
              {services.map(s => (
                <div key={s.name} className="px-4 py-3 bg-cs-s2 rounded-lg border border-cs-border text-center">
                  <div className="text-xxs text-cs-dim uppercase tracking-wider mb-2">{s.name}</div>
                  <Badge color="#3D8B7A">{s.status}</Badge>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─── Toast ─────────────────────────────────────────────
    function Toast({ msg, type, onDone }) {
      useEffect(() => { const t = setTimeout(onDone, 3500); return () => clearTimeout(t); }, []);
      const color = type === 'success' ? '#3D8B7A' : type === 'danger' ? '#C23B3B' : '#5B9FCF';
      const bg = type === 'success' ? 'rgba(61,139,122,0.12)' : type === 'danger' ? 'rgba(194,59,59,0.12)' : 'rgba(91,159,207,0.12)';
      return (
        <div className="fixed bottom-6 right-6 z-50 slide-in flex items-center gap-2.5 px-4 py-3 rounded-lg text-sm font-medium" style={{ background: bg, border: `1px solid ${color}30`, color }}>
          <div className="w-1.5 h-1.5 rounded-full" style={{ background: color }} />
          {msg}
        </div>
      );
    }

    // ─── App ───────────────────────────────────────────────
    function App() {
      const [page, setPage] = useState('dashboard');
      const [simState, setSimState] = useState('S3');
      const [toast, setToast] = useState(null);

      const margin = useMemo(() => {
        const map = { S1: 0.85, S2: 0.45, S3: 0.083, S4: -0.12, S5: -0.20 };
        return map[simState] || 0;
      }, [simState]);

      // Expose to global for onclick handlers
      window.__setSimState = setSimState;
      window.__showToast = (msg, type) => setToast({ msg, type });

      const pages = {
        dashboard: <DashboardPage state={simState} margin={margin} />,
        approvals: <ApprovalCardPage />,
        allocations: <AllocationsPage />,
        audit: <AuditPage />,
        settings: <SettingsPage />,
      };

      return (
        <div className="flex h-screen bg-cs-bg">
          <Sidebar page={page} onNav={setPage} />
          <main className="flex-1 overflow-y-auto">
            <div className="max-w-6xl mx-auto px-6 py-5">
              {pages[page]}
            </div>
          </main>
          {toast && <Toast msg={toast.msg} type={toast.type} onDone={() => setToast(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
